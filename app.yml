version: 2

name: AGENT_TRACE_REVIEW_WORKBENCH
database: RULE190
schema: APP
query_warehouse: COMPUTE_WH

# The remote build job defaults to the deploying role's PERSONAL database
# (USER$<login_name>). A TYPE = SERVICE user has no personal database, so
# without this the CI deploy fails in the build phase with a database error.
# Pinning it to the deploy destination is what makes the build runnable by a
# service identity rather than only by a human.
build_job_location: RULE190.APP

ignore:
  - node_modules
  - .env*
  - __pycache__
  - "*.pyc"
  - .next
  - .git
  - snowflake.log

profile:
  label: "Agent Trace Review Workbench"
  description: "Human review, failure discovery, and evaluator calibration for Cortex Agent traces"
  icon: icon.svg

install:
  commands:
    - ["npm", "ci", "--include=dev"]

run:
  command: ["node", ".next/standalone/server.js"]
  executeAsCaller: true
