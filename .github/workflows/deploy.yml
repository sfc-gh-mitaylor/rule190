# Deployment: the only path from this repo into Snowflake.
#
# Differences from ci.yml, all deliberate:
#   - Manual trigger only. No push or PR can deploy. Shipping is a decision,
#     not a side effect of merging.
#   - Runs in the `dogfood` GitHub environment, which requires your approval
#     before the job starts.
#   - Authenticates with a short-lived GitHub OIDC token. There is no
#     password, PAT, private key or config.toml anywhere in this repo or in
#     GitHub secrets. The Snowflake user SVC_GITHUB_ACTIONS_RULE190 has no
#     credential that can be stolen, because it has no credential.
#   - Uses role R190_DEPLOY, scoped to RULE190.APP. Not ACCOUNTADMIN.
#
# The OIDC trust is bound to subject
#   repo:sfc-gh-mitaylor/rule190:environment:dogfood
# which is why the `environment:` line below is load-bearing security, not
# just bookkeeping: a workflow in another repo, on another branch, or in a
# fork produces a different subject and Snowflake rejects it.

name: Deploy

on:
  workflow_dispatch:

permissions:
  id-token: write   # mint the OIDC token — the whole point
  contents: read    # actions/checkout; without this the clone fails

# Two deploys of the same app at once would race to CREATE OR ALTER the same
# Application Service. Queue them instead, and never cancel a deploy
# mid-flight — a half-applied deploy is worse than a late one.
concurrency:
  group: deploy-dogfood
  cancel-in-progress: false

env:
  # Account identifier is not a secret. Hardcoding it keeps the workflow
  # readable and avoids pretending that hiding it buys security.
  SNOWFLAKE_ACCOUNT: SFSEEUROPE-EU_DEMO211
  APP_NAME: AGENT_TRACE_REVIEW_WORKBENCH

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: dogfood

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify before deploying
        # Same gate as CI. Deploying something that has not passed verify
        # would make the CI signal meaningless.
        run: npm run verify

      - name: Set up Snowflake CLI with OIDC
        uses: snowflakedb/snowflake-actions@v2
        with:
          use-oidc: true

      - name: Test connection
        # Fail here, loudly and cheaply, rather than part-way through a
        # deploy. This is the step that proves OIDC and the network policy
        # are both working.
        run: |
          snow connection test -x
          snow sql -q "SELECT CURRENT_USER() AS USER, CURRENT_ROLE() AS ROLE, CURRENT_ACCOUNT() AS ACCOUNT" -x

      - name: Apply setup SQL
        # Idempotent; runs on every deploy by design.
        run: snow sql -f sql/setup.sql -x

      - name: Validate app manifest
        run: snow app validate -x

      - name: Deploy app
        run: snow app deploy -x

      - name: Check deployment health
        # Two assertions, because neither alone is sufficient.
        #
        # 1. Service state from Snowflake: status RUNNING with at least one
        #    live instance. This is the authoritative health signal available
        #    to CI.
        # 2. Endpoint reachability. Note we do NOT assert HTTP 200: the app
        #    endpoint sits behind Snowflake SSO, so an unauthenticated request
        #    from a runner is *correctly* answered with a 302 redirect to
        #    login. Asserting 200 here would be asserting that authentication
        #    is broken. We assert the endpoint is serving and not erroring:
        #    2xx/3xx/401/403 pass, 5xx or no-response fail.
        run: |
          set -euo pipefail

          echo "--- service state ---"
          snow sql -q "SHOW APPLICATION SERVICES LIKE '${{ env.APP_NAME }}' IN SCHEMA RULE190.APP" --format json -x > /tmp/svc.json
          cat /tmp/svc.json
          STATUS=$(jq -r '.[0].status // "MISSING"' /tmp/svc.json)
          INSTANCES=$(jq -r '.[0].current_instances // 0' /tmp/svc.json)
          URL=$(jq -r '.[0].url // ""' /tmp/svc.json)
          echo "status=$STATUS instances=$INSTANCES url=$URL"

          if [ "$STATUS" != "RUNNING" ]; then
            echo "FAIL: application service status is '$STATUS', expected RUNNING."
            exit 1
          fi
          if [ "${INSTANCES:-0}" -lt 1 ]; then
            echo "FAIL: application service has no running instances."
            exit 1
          fi
          if [ -z "$URL" ]; then
            echo "FAIL: application service reports no endpoint URL."
            exit 1
          fi

          echo "--- endpoint reachability ---"
          for attempt in 1 2 3 4 5 6 7 8; do
            CODE=$(curl -s -o /tmp/health.body -w '%{http_code}' --max-time 20 "https://${URL%/}/api/health" || echo 000)
            echo "attempt $attempt: HTTP $CODE"
            case "$CODE" in
              2*|3*|401|403)
                echo "PASS: endpoint is serving (HTTP $CODE)."
                head -c 400 /tmp/health.body 2>/dev/null || true
                exit 0
                ;;
            esac
            sleep 15
          done
          echo "FAIL: endpoint never returned a healthy status code."
          head -c 400 /tmp/health.body 2>/dev/null || true
          exit 1
